services:
  postgres:
    image: postgres:17
    container_name: bridge-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis
    container_name: bridge-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
