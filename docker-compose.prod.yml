services:
  postgres:
    image: postgres:17
    container_name: bridge-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bridge
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]

  redis:
    image: redis:7
    container_name: bridge-redis
    restart: unless-stopped
    networks: [internal]

  backend:
    build: ./backend
    container_name: bridge-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/bridge?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ENV: production
    ports:
      - "127.0.0.1:8080:8080"
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_WS_URL: wss://bridgeplusplus.com/ws
    container_name: bridge-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_ORIGIN: http://backend:8080
    ports:
      - "127.0.0.1:3000:3000"
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
